<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Iconos PNG - EspaOil</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    h1 { color: #dc2626; }
    #status { 
      background: white; 
      padding: 20px; 
      border-radius: 8px;
      margin-top: 20px;
    }
    .success { color: #059669; }
    .error { color: #dc2626; }
    button {
      background: #dc2626;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 10px;
    }
    button:hover { background: #b91c1c; }
    .file-item {
      padding: 8px;
      margin: 4px 0;
      background: #f9fafb;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h1>Generador de Iconos PNG - EspaOil</h1>
  <p>Este script generará iconos PNG en los siguientes tamaños:</p>
  <ul>
    <li><strong>180x180</strong> - Apple Touch Icon (iOS)</li>
    <li><strong>192x192</strong> - Android Chrome (estándar PWA)</li>
    <li><strong>512x512</strong> - Android Chrome (alta resolución PWA)</li>
    <li><strong>1024x1024</strong> - Alta resolución / Futuro uso App Store</li>
  </ul>
  
  <button onclick="generateAll()">Generar Iconos PNG</button>
  
  <div id="status"></div>

  <script>
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="EspaOil app icon">
  <rect width="512" height="512" fill="#fee2e2"/>
  <g transform="translate(256 256)" fill="#dc2626">
    <rect x="-50" y="-60" width="70" height="100" rx="8" stroke="#dc2626" stroke-width="3" fill="none"/>
    <rect x="-42" y="-48" width="54" height="32" rx="4" fill="#dc2626"/>
    <rect x="-56" y="38" width="82" height="8" rx="4" fill="#dc2626"/>
    <path d="M 20 -10 L 38 -10 C 46 -10 52 -4 52 4 L 52 24 C 52 30 48 35 42 37 C 36 39 30 36 28 30 L 28 16 L 38 16 L 38 24 C 38 26 40 28 42 28 C 44 28 46 26 46 24 L 46 4 C 46 2 44 0 42 0 L 20 0 Z" fill="#dc2626"/>
    <g transform="translate(50 -20)">
      <circle cx="0" cy="0" r="3" fill="#dc2626"/>
      <circle cx="8" cy="-6" r="2.5" fill="#dc2626"/>
      <circle cx="14" cy="2" r="2" fill="#dc2626"/>
    </g>
  </g>
</svg>`;

    const sizes = [
      { size: 180, name: 'apple-touch-icon.png', desc: 'Apple Touch Icon' },
      { size: 192, name: 'icon-192.png', desc: 'Android Chrome estándar' },
      { size: 512, name: 'icon-512.png', desc: 'Android Chrome HD' },
      { size: 1024, name: 'icon-1024.png', desc: 'Alta resolución' }
    ];

    const status = document.getElementById('status');
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');

    function generateIcon(config) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const blob = new Blob([svg], { type: 'image/svg+xml' });
        const url = URL.createObjectURL(blob);

        img.onload = function() {
          canvas.width = config.size;
          canvas.height = config.size;
          ctx.clearRect(0, 0, config.size, config.size);
          ctx.drawImage(img, 0, 0, config.size, config.size);
          
          canvas.toBlob((blob) => {
            const link = document.createElement('a');
            link.download = config.name;
            link.href = URL.createObjectURL(blob);
            link.click();
            URL.revokeObjectURL(url);
            resolve(config);
          }, 'image/png');
        };

        img.onerror = () => reject(new Error('Error cargando SVG'));
        img.src = url;
      });
    }

    async function generateAll() {
      status.innerHTML = '<p>Generando iconos...</p>';
      
      try {
        for (const config of sizes) {
          await generateIcon(config);
          status.innerHTML += `<div class="file-item success">✓ ${config.name} (${config.size}x${config.size}) - ${config.desc}</div>`;
          // Small delay to ensure browser processes the download
          await new Promise(resolve => setTimeout(resolve, 100));
        }
        
        status.innerHTML += `
          <p class="success" style="margin-top: 20px; font-weight: bold;">
            ✓ ¡Todos los iconos generados correctamente!
          </p>
          <p style="margin-top: 10px;">
            <strong>Siguiente paso:</strong><br>
            Mueve todos los archivos PNG descargados a la carpeta <code>public/icons/</code>
          </p>
        `;
      } catch (err) {
        status.innerHTML += `<p class="error">Error: ${err.message}</p>`;
      }
    }
  </script>
</body>
</html>
