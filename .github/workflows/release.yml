name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Build app
        run: npm run build

      - name: Ensure manifest tag exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -e "const m=require('./.release-please-manifest.json'); process.stdout.write(m['.']);")
          TAG="v${VERSION}"
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}"; then
            echo "Tag ${TAG} already exists"
            exit 0
          fi

          RELEASE_PR_SHA=$(gh pr list \
            --state merged \
            --search "chore: release in:title" \
            --limit 1 \
            --json mergeCommit \
            --jq '.[0].mergeCommit.oid // empty')

          if [ -z "${RELEASE_PR_SHA}" ]; then
            echo "No merged release PR found to backfill tag ${TAG}" >&2
            exit 1
          fi

          echo "Tag ${TAG} missing, creating it from merged release PR commit ${RELEASE_PR_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${TAG}" "${RELEASE_PR_SHA}"
          git push origin "refs/tags/${TAG}"

      - name: Backfill missing releases
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

      - name: Run release-please
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
